<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كود الإشعارات</title>
<style>body{font-family:sans-serif;background:#101a16;color:#fff;padding:20px;text-align:center}
button{font-size:22px;padding:18px 24px;border:0;border-radius:14px;background:#4cc79a;width:100%}
textarea{width:100%;height:160px;margin-top:16px;font-size:12px;direction:ltr}
#m{margin-top:16px;font-size:18px}</style></head><body>
<h2>كود إشعارات الخلفية</h2>
<button onclick="go()">اضغط هنا</button>
<div id="m"></div>
<textarea id="t" style="display:none" onclick="this.select()"></textarea>
<script>
const K='BAct_IzxhVL2tMbCvV-ueW0X24fVW6Ebz-S8qFfPXO86U-cOYJaOtkAqC0nAFesLd0ZHl6haxVNwlfwVpdUPGB0';
const m=x=>document.getElementById('m').textContent=x;
async function go(){try{
 if(await Notification.requestPermission()!=='granted')return m('لازم تضغط سماح للإشعارات');
 m('جاري التفعيل...');
 await navigator.serviceWorker.register('sw.js');
 const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,j)=>setTimeout(()=>j(new Error('ملف sw.js مش موجود')),8000))]);
 let s=await reg.pushManager.getSubscription();if(s)await s.unsubscribe();
 const u=K.replace(/-/g,'+').replace(/_/g,'/'),a=atob(u+'='.repeat((4-u.length%4)%4));
 s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(a,c=>c.charCodeAt(0))});
 const t=document.getElementById('t');t.style.display='block';t.value=JSON.stringify(s);t.select();
 try{await navigator.clipboard.writeText(t.value);m('تم نسخ الكود ✅')}catch(_){m('اضغط على المربع وانسخ الكود')}
}catch(e){m('فشل: '+e.message)}}
</script></body></html>
